[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "easel-media-adapters"
version = "0.5.0"
description = "Independent media adapters for Easel"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "Pillow>=10,<13"]

[project.entry-points."easel.media_adapters"]
qwen-asr-aligner = "easel_media_adapters.qwen:QwenAdapter"
openai-transcription = "easel_media_adapters.openai:OpenAITranscriptionAdapter"

h3-video = "easel_media_adapters.h3:H3Adapter"
rapidocr = "easel_media_adapters.rapidocr:RapidOCRAdapter"
openai-speech = "easel_media_adapters.speech:OpenAISpeechAdapter"
yue2-music = "easel_media_adapters.yue2:YuE2Adapter"

[tool.setuptools.packages.find]
where = ["src"]
